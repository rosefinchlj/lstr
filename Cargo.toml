[package]
name = "lstr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, quiet Windows launcher backed by Everything"

[workspace]
members = ["crates/lstr-index"]

[dependencies]
lstr-index = { path = "crates/lstr-index" }
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "default_fonts"] }
everything-ipc = "0.1.4"
pinyin = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
tray-icon = "0.26.1"
window-vibrancy = "0.8.1"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Time",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
] }
windows-core = "0.62.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
