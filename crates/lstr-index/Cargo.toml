[package]
name = "lstr-index"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "NTFS USN-backed filename index engine for lstr"

[dependencies]
regex = "1"
regex-syntax = "0.8"
pinyin = "0.11.0"
memchr = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
